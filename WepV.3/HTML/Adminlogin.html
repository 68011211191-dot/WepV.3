function clearErr(){u.classList.remove("err");pw.classList.remove("err");msg.textContent=""}
u.addEventListener("input",clearErr);pw.addEventListener("input",clearErr);
document.addEventListener("keydown",function(e){if(e.key==="Escape")location.href="login.html"});
document.getElementById("toLogin").addEventListener("click",function(){u.focus()});
document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();clearErr();
  var bad=!u.value.trim()?u:(!pw.value?pw:null);
  if(bad){bad.classList.add("err");msg.textContent=bad===u?"กรุณากรอก username":"กรุณากรอก password";bad.focus();return}
  go.disabled=true;go.classList.add("busy");go.textContent="กำลังเข้าสู่ระบบ...";
  /* TODO: ตรวจสอบสิทธิ์กับระบบหลังบ้านตรงนี้ แล้วค่อยเปลี่ยนหน้า */
  setTimeout(function(){location.href="Admin_list.html"},600);
});
