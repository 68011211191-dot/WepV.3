<div class="dlg" id="dlg" aria-hidden="true"><div class="dlgbox" role="alertdialog" aria-modal="true" aria-labelledby="dTitle" aria-describedby="dText"><div class="dlgico" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#25289c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5M16 8l4 4-4 4M20 12H9"/></svg></div><h4 id="dTitle"></h4><p id="dText"></p><div class="dlgbtns"><button type="button" id="dNo">ยกเลิก</button><button type="button" id="dYes">ยืนยัน</button></div></div></div>
<script>
var dFn=null,dPrev=null;
function ask(title,text,yes,fn){document.getElementById("dTitle").textContent=title;document.getElementById("dText").textContent=text;document.getElementById("dYes").textContent=yes;dFn=fn;dPrev=document.activeElement;var m=document.getElementById("dlg");m.classList.add("open");m.setAttribute("aria-hidden","false");document.getElementById("dNo").focus()}
function closeD(){var m=document.getElementById("dlg");m.classList.remove("open");m.setAttribute("aria-hidden","true");dFn=null;if(dPrev&&dPrev.focus)dPrev.focus()}
addEventListener("keydown",function(e){if(!document.getElementById("dlg").classList.contains("open"))return;if(e.key==="Escape"){closeD();return}if(e.key==="Tab"){var a=[document.getElementById("dNo"),document.getElementById("dYes")],i=a.indexOf(document.activeElement);e.preventDefault();a[(i+(e.shiftKey?-1:1)+2)%2].focus()}});
document.getElementById("dNo").addEventListener("click",closeD);document.getElementById("dlg").addEventListener("click",function(e){if(e.target===this)closeD()});
document.getElementById("dYes").addEventListener("click",function(){var f=dFn;closeD();if(f)f()});
function fit(){var w=document.getElementById("wrap"),p=document.getElementById("page"),vw=innerWidth,vh=innerHeight,k=Math.min(vw/1440,1.3);w.style.width=(vw/k)+"px";w.style.transform="scale("+k+")";p.style.minHeight=(vh/k)+"px";w.style.marginBottom=(w.offsetHeight*(k-1))+"px"}
addEventListener("resize",fit);
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function badge(){var el=document.getElementById("histBadge");if(!el)return;var n=load("kyor_history",[]).length;el.textContent=n>0?(n>99?"99+":n):""}
function goTabs(){document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){var h=t.dataset.href;if(h){location.href=h;return}document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});t.classList.add("on")})})}
